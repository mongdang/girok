<svg xmlns="http://www.w3.org/2000/svg" width="660" height="314" viewBox="0 0 660 314" role="img" aria-label="스위치가 아니라 이유를 요구한다">
  <rect width="660" height="314" rx="10" fill="#0F1319"/>
  <rect x="0.5" y="0.5" width="659" height="313" rx="10" fill="none" stroke="#272E38"/>
  <path d="M0 10 a10 10 0 0 1 10 -10 h640 a10 10 0 0 1 10 10 v24 h-660 z" fill="#161B22"/>
  <line x1="0" y1="34" x2="660" y2="34" stroke="#272E38"/>
  <circle cx="20" cy="17.0" r="5" fill="#E06C5B"/><circle cx="36" cy="17.0" r="5" fill="#E0B45B"/><circle cx="52" cy="17.0" r="5" fill="#5BB07A"/>
  <text x="330" y="21" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans KR,Helvetica,Arial,sans-serif" font-size="11.5" fill="#7D8590">스위치가 아니라 이유를 요구한다</text>
  <text x="20.0" y="54.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#4E9B6C">$</tspan><tspan fill="#C9D1D9"> git push origin +master</tspan></text><text x="20.0" y="75.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="13.5" xml:space="preserve" fill="#C9D1D9"></text><text x="20.0" y="96.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#D4644A">[차단]</tspan><tspan fill="#C9D1D9"> force push 금지 — 변경 이력 자체가 결정 기록이라 되돌리기 어렵다.</tspan></text><text x="20.0" y="117.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="13.5" xml:space="preserve" fill="#98A2AE">       이력 정리가 필요하면 트리 불변 커밋(`-s ours` 조상 연결 등)으로</text><text x="20.0" y="138.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="13.5" xml:space="preserve" fill="#98A2AE">       할 것. 그래도 해야 한다면 GIROK_FORCE_PUSH_REASON 에 이유를 담아</text><text x="20.0" y="159.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="13.5" xml:space="preserve" fill="#98A2AE">       실행할 것 — 스위치가 아니라 이유다(8자 이상). 그 이유는 세션에</text><text x="20.0" y="180.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="13.5" xml:space="preserve" fill="#98A2AE">       그대로 남는다</text><text x="20.0" y="201.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="13.5" xml:space="preserve" fill="#C9D1D9"></text><text x="20.0" y="222.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#4E9B6C">$</tspan><tspan fill="#C9D1D9"> GIROK_FORCE_PUSH_REASON="이력 리셋 — 사용자 지시 2026-09-01" \</tspan></text><text x="20.0" y="243.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="13.5" xml:space="preserve" fill="#98A2AE">    git push origin +master</text><text x="20.0" y="264.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="13.5" xml:space="preserve" fill="#C9D1D9"></text><text x="20.0" y="285.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#4E9B6C">[girok]</tspan><tspan fill="#C9D1D9"> 규칙을 어겼다: force push · 이유가 세션 기록에 남았다</tspan></text>
</svg>
