<svg xmlns="http://www.w3.org/2000/svg" width="660" height="314" viewBox="0 0 660 314" role="img" aria-label="It asks for a reason, not a switch">
  <rect width="660" height="314" rx="10" fill="#0F1319"/>
  <rect x="0.5" y="0.5" width="659" height="313" rx="10" fill="none" stroke="#272E38"/>
  <path d="M0 10 a10 10 0 0 1 10 -10 h640 a10 10 0 0 1 10 10 v24 h-660 z" fill="#161B22"/>
  <line x1="0" y1="34" x2="660" y2="34" stroke="#272E38"/>
  <circle cx="20" cy="17.0" r="5" fill="#E06C5B"/><circle cx="36" cy="17.0" r="5" fill="#E0B45B"/><circle cx="52" cy="17.0" r="5" fill="#5BB07A"/>
  <text x="330" y="21" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans KR,Helvetica,Arial,sans-serif" font-size="11.5" fill="#7D8590">It asks for a reason, not a switch</text>
  <text x="20.0" y="54.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#4E9B6C">$</tspan><tspan fill="#C9D1D9"> git push origin +master</tspan></text><text x="20.0" y="75.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="13.5" xml:space="preserve" fill="#C9D1D9"></text><text x="20.0" y="96.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#D4644A">[blocked]</tspan><tspan fill="#C9D1D9"> force push — history is itself a decision record and is hard</tspan></text><text x="20.0" y="117.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="13.5" xml:space="preserve" fill="#98A2AE">          to undo. To tidy history, use a tree-identical commit (`-s</text><text x="20.0" y="138.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="13.5" xml:space="preserve" fill="#98A2AE">          ours` linking the ancestor). If you still must, run it with</text><text x="20.0" y="159.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="13.5" xml:space="preserve" fill="#98A2AE">          GIROK_FORCE_PUSH_REASON — a reason, not a switch (8+ chars).</text><text x="20.0" y="180.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="13.5" xml:space="preserve" fill="#98A2AE">          That reason stays on the session record</text><text x="20.0" y="201.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="13.5" xml:space="preserve" fill="#C9D1D9"></text><text x="20.0" y="222.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#4E9B6C">$</tspan><tspan fill="#C9D1D9"> GIROK_FORCE_PUSH_REASON="history reset — instructed 2026-09-01" \</tspan></text><text x="20.0" y="243.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="13.5" xml:space="preserve" fill="#98A2AE">    git push origin +master</text><text x="20.0" y="264.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="13.5" xml:space="preserve" fill="#C9D1D9"></text><text x="20.0" y="285.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#4E9B6C">[girok]</tspan><tspan fill="#C9D1D9"> rule broken: force push · reason is on the record</tspan></text>
</svg>
